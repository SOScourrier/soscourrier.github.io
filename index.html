<style>
  :root { --bleu:#2C5CA8; --navy:#12233B; --texte:#3b4759; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#EEF3FB;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--texte); padding:24px;
  }
  .carte {
    background:#fff; width:100%; max-width:520px;
    border-radius:20px; padding:48px 40px; text-align:center;
    box-shadow:0 12px 40px rgba(18,35,59,.10);
  }
  .logo { max-width:300px; width:80%; height:auto; margin:0 auto 28px; display:block; }
  .sep { width:56px; height:4px; background:var(--bleu); border-radius:2px; margin:0 auto 28px; }
  h1 { font-size:1.05rem; letter-spacing:1px; text-transform:uppercase; color:var(--navy); margin:0 0 24px; }
  .bloc { margin:18px 0; line-height:1.6; }
  .label { font-size:.8rem; text-transform:uppercase; letter-spacing:1px; color:var(--bleu); font-weight:700; margin-bottom:4px; }
  address { font-style:normal; font-size:1.1rem; color:var(--navy); }
  a { color:var(--bleu); text-decoration:none; font-weight:600; font-size:1.1rem; }
  a:hover { text-decoration:underline; }
  .note { margin-top:28px; font-size:.9rem; color:#7a8699; }
</style>
